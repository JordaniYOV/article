[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planetary-vlm-benchmark"
version = "0.2.0"
description = "Model-independent planetary VLM inference and evaluation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
images = ["Pillow>=10", "numpy>=1.26"]
distortion = ["numpy>=1.26,<2.3", "opencv-python-headless>=4.12,<4.13"]
hf = ["torch>=2.5", "transformers>=4.49,<5", "accelerate>=1"]
quantization = ["bitsandbytes>=0.45"]
stereo = ["Pillow>=10", "numpy>=1.26,<2.3", "opencv-python-headless>=4.12,<4.13"]

[project.scripts]
planetary-vlm = "planetary_vlm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["planetary_vlm*"]
namespaces = false

[tool.setuptools.package-data]
"planetary_vlm.datasets._mars" = ["*.ps1", "*.toml"]
