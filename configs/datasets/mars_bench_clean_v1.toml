# Full-frame clean protocol. Background (0) is unknown, never a negative label.
ignore_labels = [0]
roi = [0.0, 0.0, 1.0, 1.0]
min_valid_fraction = 1.0
dominant_min_fraction = 0.6
rock_min_pixels = 256
rock_classes = ["ROCK"]
tasks = ["terrain", "rock_presence"]
question_policy = "one_per_image"

[label_to_class]
1 = "BEDROCK"
2 = "GRAVEL_SAND_SOIL"
3 = "ROCK"
4 = "SHADOW"
5 = "SKY_OR_DISTANT_MOUNTAINS"
6 = "TRACK"
